<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>raidspray — Art Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#050505',
                        panelbg: '#101010',
                        bordercolor: '#222222',
                        accentblue: '#0055ff'
                    },
                    fontFamily: {
                        sans: ['Inter', sans-serif]
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #050505;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #222222;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #0055ff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">
    <header class="border-b border-[#222222] bg-[#0a0a0a] sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded bg-blue-600 flex items-center justify-center font-bold text-white text-base shadow-sm shadow-blue-600/30">
                    R
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">
                    raid<span class="text-blue-500">spray</span>
                </h1>
            </div>

            <div class="flex items-center space-x-3">
                <div id="syncStatus" class="hidden sm:flex items-center space-x-1.5 text-[11px] text-gray-400 bg-[#141414] border border-[#222222] px-2.5 py-1.5 rounded">
                    <span id="syncDot" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
                    <span id="syncText">Connecting...</span>
                </div>
                <button onclick="openUploadModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded transition-colors flex items-center space-x-2 shadow-md shadow-blue-600/20">
                    <i class="fa-solid fa-plus"></i>
                    <span>Upload Art</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        <div id="boardGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
            <!-- injected -->
        </div>

        <div id="emptyState" class="hidden text-center py-24">
            <div class="w-14 h-14 bg-[#101010] border border-[#222222] rounded-full flex items-center justify-center mx-auto text-blue-500 text-xl mb-3 shadow-inner">
                <i class="fa-solid fa-image"></i>
            </div>
            <p id="emptyTitle" class="text-sm font-semibold text-white mb-1">No artworks yet</p>
            <p id="emptyDesc" class="text-xs text-gray-500 mb-5">Upload your first piece of art to populate the board.</p>
            <button onclick="openUploadModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded transition-colors shadow-md shadow-blue-600/20">
                Upload Art
            </button>
        </div>
    </main>

    <footer class="border-t border-[#222222] bg-[#0a0a0a] py-6 text-center text-xs text-gray-500">
        <p>raidspray &bull; Clean image board</p>
    </footer>

    <div id="detailModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden items-center justify-center p-3 sm:p-6">
        <div class="bg-[#101010] border border-[#222222] rounded-lg max-w-4xl w-full max-h-[90vh] flex flex-col md:flex-row overflow-hidden relative shadow-2xl">
            <button onclick="closeModal('detailModal')" class="absolute top-3 right-3 z-10 w-8 h-8 rounded bg-black/70 hover:bg-black text-white flex items-center justify-center border border-[#222222] transition-colors">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <div class="md:w-3/5 bg-black flex items-center justify-center p-2 relative min-h-[250px] md:min-h-[450px]">
                <img id="modalImg" src="" alt="" class="max-h-[75vh] max-w-full object-contain rounded">
            </div>

            <div class="md:w-2/5 p-5 sm:p-6 flex flex-col justify-between bg-[#101010] border-t md:border-t-0 md:border-l border-[#222222]">
                <div>
                    <span class="text-[10px] uppercase tracking-wider text-blue-500 font-semibold block mb-1">Artwork Title</span>
                    <h2 id="modalTitle" class="text-base sm:text-lg font-bold text-white mb-3 break-words"></h2>

                    <span class="text-[10px] uppercase tracking-wider text-gray-500 font-semibold block mb-1">Uploaded Date</span>
                    <p id="modalDate" class="text-xs text-gray-300"></p>
                </div>

                <div class="pt-4 mt-6 border-t border-[#222222] flex items-center justify-between">
                    <button onclick="deleteCurrentArtwork()" class="text-red-400 hover:text-red-300 text-xs font-medium flex items-center space-x-1.5 transition-colors">
                        <i class="fa-solid fa-trash"></i>
                        <span>Delete Art</span>
                    </button>
                    <button onclick="closeModal('detailModal')" class="bg-[#222222] hover:bg-[#333333] text-white text-xs font-semibold px-3.5 py-1.5 rounded transition-colors">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="uploadModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden items-center justify-center p-3 sm:p-6">
        <div class="bg-[#101010] border border-[#222222] rounded-lg max-w-sm w-full p-5 relative shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-cloud-arrow-up text-blue-500"></i>
                    <span>Upload New Art</span>
                </h3>
                <button onclick="closeModal('uploadModal')" class="text-gray-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="uploadForm" onsubmit="handleArtSubmit(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Image Title</label>
                    <input type="text" id="artTitle" required placeholder="Enter artwork title..." class="w-full bg-[#050505] border border-[#222222] rounded p-2 text-white placeholder-gray-600 focus:outline-none focus:border-blue-600 transition-colors">
                </div>

                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Select Image File</label>
                    <input type="file" id="artFile" accept="image/*" required class="w-full bg-[#050505] border border-[#222222] rounded p-1.5 text-gray-300 text-[11px] file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                </div>

                <div class="pt-2 flex items-center justify-end space-x-2">
                    <button type="button" onclick="closeModal('uploadModal')" class="bg-[#1a1a1a] text-gray-300 px-3.5 py-1.5 rounded hover:bg-[#252525] transition-colors">Cancel</button>
                    <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-1.5 rounded transition-colors shadow-lg shadow-blue-600/20">Publish</button>
                </div>
            </form>
        </div>
    </div>

    <div id="alertModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-[#101010] border border-[#222222] rounded-lg max-w-xs w-full p-4 text-center">
            <p id="alertMessage" class="text-xs text-gray-200 mb-4"></p>
            <button onclick="closeModal('alertModal')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-1.5 rounded transition-colors">OK</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const STORAGE_KEY = 'raidspray-artworks-v1';
        let artworks = [];
        let selectedArtDocId = null;
        let db = null;
        let firebaseReady = false;

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'raidspray-art-board';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

        function formatDate(dateValue) {
            return new Date(dateValue).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function setSyncState(label, colorClass) {
            const syncText = document.getElementById('syncText');
            const syncDot = document.getElementById('syncDot');
            syncText.textContent = label;
            syncDot.className = `w-2 h-2 rounded-full ${colorClass}`;
        }

        function saveLocalArtworks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(artworks));
        }

        function loadLocalArtworks() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) return [];
                const parsed = JSON.parse(saved);
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                console.error('Could not load local artworks:', error);
                return [];
            }
        }

        function sortArtworks(list) {
            return [...list].sort((a, b) => (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0));
        }

        window.showAlert = function(msg) {
            document.getElementById('alertMessage').textContent = msg;
            const el = document.getElementById('alertModal');
            el.classList.remove('hidden');
            el.classList.add('flex');
        };

        function renderBoard() {
            const grid = document.getElementById('boardGrid');
            const emptyState = document.getElementById('emptyState');
            const emptyTitle = document.getElementById('emptyTitle');
            const emptyDesc = document.getElementById('emptyDesc');

            if (artworks.length === 0) {
                grid.innerHTML = '';
                emptyTitle.textContent = 'No artworks yet';
                emptyDesc.textContent = 'Upload your first piece of art to populate the board.';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = artworks.map(art => `
                <div onclick="openLightbox('${art.docId}')" class="group bg-[#101010] border border-[#222222] hover:border-blue-600 rounded overflow-hidden cursor-pointer transition-all duration-200 flex flex-col shadow-sm">
                    <div class="relative aspect-square bg-black overflow-hidden flex items-center justify-center">
                        <img src="${art.image}" alt="${art.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-2">
                            <span class="text-[10px] font-semibold text-white bg-blue-600 px-1.5 py-0.5 rounded shadow">View</span>
                        </div>
                    </div>
                    <div class="p-2.5 bg-[#101010] flex-grow flex items-center">
                        <h4 class="text-xs font-semibold text-white truncate group-hover:text-blue-400 transition-colors w-full">${art.title}</h4>
                    </div>
                </div>
            `).join('');
        }

        window.openUploadModal = function() {
            document.getElementById('uploadForm').reset();
            const el = document.getElementById('uploadModal');
            el.classList.remove('hidden');
            el.classList.add('flex');
            document.body.style.overflow = 'hidden';
        };

        window.closeModal = function(modalId) {
            const el = document.getElementById(modalId);
            if (!el) return;
            el.classList.add('hidden');
            el.classList.remove('flex');
            document.body.style.overflow = 'auto';
        };

        window.openLightbox = function(docId) {
            const art = artworks.find(a => a.docId === docId);
            if (!art) return;

            selectedArtDocId = docId;
            document.getElementById('modalImg').src = art.image;
            document.getElementById('modalTitle').textContent = art.title;
            document.getElementById('modalDate').textContent = art.date || formatDate(Date.now());

            const el = document.getElementById('detailModal');
            el.classList.remove('hidden');
            el.classList.add('flex');
            document.body.style.overflow = 'hidden';
        };

        window.deleteCurrentArtwork = async function() {
            if (!selectedArtDocId) return;

            const confirmed = window.confirm ? window.confirm('Delete this artwork?') : true;
            if (!confirmed) return;

            try {
                if (firebaseReady && db && !String(selectedArtDocId).startsWith('local_')) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'artworks', selectedArtDocId);
                    await deleteDoc(docRef);
                } else {
                    artworks = artworks.filter(a => a.docId !== selectedArtDocId);
                    saveLocalArtworks();
                    renderBoard();
                }
                closeModal('detailModal');
            } catch (error) {
                console.error('Error deleting artwork:', error);
                showAlert('Failed to delete artwork.');
            }
        };

        window.handleArtSubmit = async function(e) {
            e.preventDefault();

            const titleInput = document.getElementById('artTitle');
            const fileInput = document.getElementById('artFile');
            const submitBtn = document.getElementById('submitBtn');

            const title = titleInput.value.trim();
            const file = fileInput.files && fileInput.files[0];

            if (!title || !file) {
                showAlert('Please add a title and select an image.');
                return;
            }

            if (!file.type.startsWith('image/')) {
                showAlert('Only image files are allowed.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading...';

            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    const imageDataUrl = event.target.result;
                    const newArt = {
                        docId: `local_${Date.now()}_${Math.random().toString(16).slice(2)}`,
                        title,
                        image: imageDataUrl,
                        date: formatDate(Date.now()),
                        createdAt: Date.now()
                    };

                    if (firebaseReady && db) {
                        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'artworks');
                        const created = await addDoc(colRef, {
                            title: newArt.title,
                            image: newArt.image,
                            date: newArt.date,
                            createdAt: newArt.createdAt
                        });
                        newArt.docId = created.id;
                    } else {
                        artworks.unshift(newArt);
                        artworks = sortArtworks(artworks);
                        saveLocalArtworks();
                    }

                    renderBoard();
                    closeModal('uploadModal');
                    document.getElementById('uploadForm').reset();
                } catch (error) {
                    console.error('Error saving artwork:', error);
                    showAlert('Failed to upload artwork. Please try again.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Publish';
                }
            };

            reader.onerror = function() {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Publish';
                showAlert('The image could not be read. Try another file.');
            };

            reader.readAsDataURL(file);
        };

        async function initFirebaseIfAvailable() {
            if (!Object.keys(firebaseConfig).length) {
                setSyncState('Local mode', 'bg-yellow-500');
                artworks = sortArtworks(loadLocalArtworks());
                renderBoard();
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                const auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                firebaseReady = true;
                setSyncState('Synced to cloud', 'bg-green-500');

                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'artworks');
                onSnapshot(colRef, (snapshot) => {
                    artworks = [];
                    snapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        artworks.push({
                            docId: docSnap.id,
                            title: data.title || 'Untitled',
                            image: data.image || '',
                            date: data.date || formatDate(Date.now()),
                            createdAt: Number(data.createdAt) || Date.now()
                        });
                    });
                    artworks = sortArtworks(artworks);
                    renderBoard();
                }, (error) => {
                    console.error('Firestore sync error:', error);
                    setSyncState('Cloud offline', 'bg-red-500');
                    artworks = sortArtworks(loadLocalArtworks());
                    renderBoard();
                });
            } catch (error) {
                console.error('Initialization error:', error);
                setSyncState('Local mode', 'bg-yellow-500');
                artworks = sortArtworks(loadLocalArtworks());
                renderBoard();
            }
        }

        window.onload = function() {
            initFirebaseIfAvailable();
        };
    </script>
</body>
</html>
