<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>raidspray — Art Board</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#050505',
                        panelbg: '#101010',
                        bordercolor: '#222222',
                        accentblue: '#0055ff'
                    },
                    fontFamily: {
                        sans: ['Inter', sans-serif]
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #050505;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #222222;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #0055ff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- Top Header / Navigation -->
    <header class="border-b border-[#222222] bg-[#0a0a0a] sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetSearch()">
                <div class="w-8 h-8 rounded bg-blue-600 flex items-center justify-center font-bold text-white text-base shadow-sm shadow-blue-600/30">
                    R
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">
                    raid<span class="text-blue-500">spray</span>
                </h1>
            </div>

            <!-- Upload Action Button -->
            <div>
                <button onclick="openUploadModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded transition-colors flex items-center space-x-2 shadow-md shadow-blue-600/20">
                    <i class="fa-solid fa-plus"></i>
                    <span>Upload Art</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        
        <!-- Search Bar Header -->
        <div class="bg-[#101010] border border-[#222222] rounded-lg p-4 mb-6 shadow-sm">
            <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
                <!-- Search Input -->
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input 
                        type="text" 
                        id="searchInput" 
                        oninput="handleSearch()"
                        placeholder="Search artworks by title..." 
                        class="w-full bg-[#050505] border border-[#222222] rounded px-3 py-2 pl-9 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-blue-600 transition-colors"
                    >
                </div>
                <!-- Post Counter -->
                <div class="text-xs text-gray-400 whitespace-nowrap">
                    <span id="postCount">0 artworks</span>
                </div>
            </div>
        </div>

        <!-- Post Grid -->
        <div id="boardGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
            <!-- Artworks injected dynamically -->
        </div>

        <!-- Empty State (Shown when gallery is empty or search returns nothing) -->
        <div id="emptyState" class="hidden text-center py-24">
            <div class="w-14 h-14 bg-[#101010] border border-[#222222] rounded-full flex items-center justify-center mx-auto text-blue-500 text-xl mb-3 shadow-inner">
                <i class="fa-solid fa-image"></i>
            </div>
            <p id="emptyTitle" class="text-sm font-semibold text-white mb-1">No artworks yet</p>
            <p id="emptyDesc" class="text-xs text-gray-500 mb-5">Upload your first piece of art to populate the board.</p>
            <button onclick="openUploadModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded transition-colors shadow-md shadow-blue-600/20">
                Upload Art
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-[#222222] bg-[#0a0a0a] py-6 text-center text-xs text-gray-500">
        <p>raidspray &bull; Clean image board &bull; Local browser storage</p>
    </footer>

    <!-- Artwork Lightbox / Detail Modal -->
    <div id="detailModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden items-center justify-center p-3 sm:p-6">
        <div class="bg-[#101010] border border-[#222222] rounded-lg max-w-4xl w-full max-h-[90vh] flex flex-col md:flex-row overflow-hidden relative shadow-2xl">
            <!-- Close Button -->
            <button onclick="closeModal('detailModal')" class="absolute top-3 right-3 z-10 w-8 h-8 rounded bg-black/70 hover:bg-black text-white flex items-center justify-center border border-[#222222] transition-colors">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <!-- Image View -->
            <div class="md:w-3/5 bg-black flex items-center justify-center p-2 relative min-h-[250px] md:min-h-[450px]">
                <img id="modalImg" src="" alt="" class="max-h-[75vh] max-w-full object-contain rounded">
            </div>

            <!-- Details Sidebar -->
            <div class="md:w-2/5 p-5 sm:p-6 flex flex-col justify-between bg-[#101010] border-t md:border-t-0 md:border-l border-[#222222]">
                <div>
                    <span class="text-[10px] uppercase tracking-wider text-blue-500 font-semibold block mb-1">Artwork Title</span>
                    <h2 id="modalTitle" class="text-base sm:text-lg font-bold text-white mb-3 break-words"></h2>
                    
                    <span class="text-[10px] uppercase tracking-wider text-gray-500 font-semibold block mb-1">Uploaded Date</span>
                    <p id="modalDate" class="text-xs text-gray-300"></p>
                </div>

                <div class="pt-4 mt-6 border-t border-[#222222] flex items-center justify-between">
                    <button onclick="deleteCurrentArtwork()" class="text-red-400 hover:text-red-300 text-xs font-medium flex items-center space-x-1.5 transition-colors">
                        <i class="fa-solid fa-trash"></i>
                        <span>Delete Art</span>
                    </button>
                    <button onclick="closeModal('detailModal')" class="bg-[#222222] hover:bg-[#333333] text-white text-xs font-semibold px-3.5 py-1.5 rounded transition-colors">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden items-center justify-center p-3 sm:p-6">
        <div class="bg-[#101010] border border-[#222222] rounded-lg max-w-sm w-full p-5 relative shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-cloud-arrow-up text-blue-500"></i>
                    <span>Upload New Art</span>
                </h3>
                <button onclick="closeModal('uploadModal')" class="text-gray-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="uploadForm" onsubmit="handleArtSubmit(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Image Title</label>
                    <input type="text" id="artTitle" required placeholder="Enter artwork title..." class="w-full bg-[#050505] border border-[#222222] rounded p-2 text-white placeholder-gray-600 focus:outline-none focus:border-blue-600 transition-colors">
                </div>

                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Select Image File</label>
                    <input type="file" id="artFile" accept="image/*" required class="w-full bg-[#050505] border border-[#222222] rounded p-1.5 text-gray-300 text-[11px] file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                </div>

                <div class="pt-2 flex items-center justify-end space-x-2">
                    <button type="button" onclick="closeModal('uploadModal')" class="bg-[#1a1a1a] text-gray-300 px-3.5 py-1.5 rounded hover:bg-[#252525] transition-colors">Cancel</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-1.5 rounded transition-colors shadow-lg shadow-blue-600/20">Publish</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let artworks = [];
        let selectedArtId = null;
        let searchQuery = '';

        // Initialize on page load
        window.onload = function() {
            loadArtworks();
            renderBoard();
        };

        // Load from localStorage (Starts completely empty by default)
        function loadArtworks() {
            const saved = localStorage.getItem('raidspray_artworks');
            if (saved) {
                try {
                    artworks = JSON.parse(saved);
                } catch(e) {
                    artworks = [];
                }
            } else {
                artworks = [];
            }
        }

        // Save to localStorage
        function saveArtworks() {
            localStorage.setItem('raidspray_artworks', JSON.stringify(artworks));
        }

        // Modal Helpers
        function openUploadModal() {
            document.getElementById('uploadForm').reset();
            const el = document.getElementById('uploadModal');
            el.classList.remove('hidden');
            el.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(modalId) {
            const el = document.getElementById(modalId);
            el.classList.add('hidden');
            el.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        // Search Handlers
        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            renderBoard();
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            renderBoard();
        }

        // Render Board Grid
        function renderBoard() {
            const grid = document.getElementById('boardGrid');
            const emptyState = document.getElementById('emptyState');
            const postCountEl = document.getElementById('postCount');
            const emptyTitle = document.getElementById('emptyTitle');
            const emptyDesc = document.getElementById('emptyDesc');

            // Filter by search query on title
            const filtered = artworks.filter(art => {
                if (!searchQuery) return true;
                return art.title.toLowerCase().includes(searchQuery);
            });

            postCountEl.textContent = `${filtered.length} ${filtered.length === 1 ? 'artwork' : 'artworks'}`;

            if (artworks.length === 0) {
                grid.innerHTML = '';
                emptyTitle.textContent = "No artworks yet";
                emptyDesc.textContent = "Upload your first piece of art to populate the board.";
                emptyState.classList.remove('hidden');
                return;
            }

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyTitle.textContent = "No search results";
                emptyDesc.textContent = "No artworks matched your title search query.";
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            // Render post cards matching clean post-grid layout
            grid.innerHTML = filtered.map(art => `
                <div onclick="openLightbox(${art.id})" class="group bg-[#101010] border border-[#222222] hover:border-blue-600 rounded overflow-hidden cursor-pointer transition-all duration-200 flex flex-col shadow-sm">
                    <!-- Thumbnail Container -->
                    <div class="relative aspect-square bg-black overflow-hidden flex items-center justify-center">
                        <img src="${art.image}" alt="${art.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-2">
                            <span class="text-[10px] font-semibold text-white bg-blue-600 px-1.5 py-0.5 rounded shadow">View</span>
                        </div>
                    </div>
                    <!-- Title Caption Underneath -->
                    <div class="p-2.5 bg-[#101010] flex-grow flex items-center">
                        <h4 class="text-xs font-semibold text-white truncate group-hover:text-blue-400 transition-colors w-full">${art.title}</h4>
                    </div>
                </div>
            `).join('');
        }

        // Handle Form Submission & Base64 Conversion
        function handleArtSubmit(e) {
            e.preventDefault();

            const title = document.getElementById('artTitle').value.trim();
            const fileInput = document.getElementById('artFile');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const newArt = {
                        id: Date.now(),
                        title: title,
                        image: event.target.result,
                        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
                    };

                    artworks.unshift(newArt);
                    saveArtworks();
                    closeModal('uploadModal');
                    renderBoard();
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        // Open Lightbox Modal
        function openLightbox(id) {
            const art = artworks.find(a => a.id === id);
            if (!art) return;

            selectedArtId = id;
            document.getElementById('modalImg').src = art.image;
            document.getElementById('modalTitle').textContent = art.title;
            document.getElementById('modalDate').textContent = art.date || 'Recent';

            const el = document.getElementById('detailModal');
            el.classList.remove('hidden');
            el.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        // Delete Artwork
        function deleteCurrentArtwork() {
            if (!selectedArtId) return;
            if (confirm('Delete this artwork from your gallery?')) {
                artworks = artworks.filter(a => a.id !== selectedArtId);
                saveArtworks();
                closeModal('detailModal');
                renderBoard();
            }
        }
    </script>
</body>
</html>
